name: adsp32021-mlops-final
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pandas>=2.2
  - numpy>=1.26
  - requests>=2.31
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - jupyter>=1.0
  - nbformat>=5.10
  - pip:
      # Drift monitoring (drift_monitoring.py)
      - evidently>=0.4
      # Databricks-only notebooks -- see the note in requirements.txt. Not required
      # to run the local scripts (train_baseline.py, test_ingestion_local.py,
      # drift_monitoring.py); the Databricks cluster provides pyspark/mlflow/
      # databricks-feature-engineering on its own.
      - pyspark>=3.5
      - mlflow>=2.11
      - databricks-feature-engineering>=0.6
      - flaml>=2.1
